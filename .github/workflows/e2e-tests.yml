name: E2E Tests

on:
  push:
    branches: [main, master]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build blog-backend image
        working-directory: ./backend
        run: docker build --build-arg START_CMD="npm run start:test" -t blog-backend -f Dockerfile .

      - name: Build blog-frontend image
        working-directory: ./frontend
        run: docker build -t blog-frontend -f Dockerfile .

      - name: Start blog-devops with Docker Compose
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for nginx to be ready on port 8080..."
          timeout 120 bash -c 'until curl -f http://localhost:8080 > /dev/null 2>&1; do sleep 2; done'
          echo "Services are ready!"

      - name: Check running containers
        run: docker ps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== Frontend logs ==="
          docker compose logs app
          echo "=== Nginx logs ==="
          docker compose logs nginx

      - name: Clean up Docker containers
        if: always()
        run: docker compose down -v
