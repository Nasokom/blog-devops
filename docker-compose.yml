services:
  app:
    image: blog-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # ports:
    #   - 4173:4173
    # environment:
    #   - BACKEND_URL=/api
    volumes:
      - dist:/usr/src/app/dist
      - front_node_modules:/usr/src/app/node_modules
  backend:
    image: blog-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - backend_node_modules:/usr/src/app/node_modules
      # - ./backend/:/usr/src/app
  nginx:
    image: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - dist:/usr/share/nginx/html:ro

    depends_on:
      - app
volumes:
  front_node_modules:
  backend_node_modules:
  dist:
  mongo_data:
